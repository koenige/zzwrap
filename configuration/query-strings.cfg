; section = ID of rule: package, optional scope, key of query string
; use: wrap_url_qs('zzwrap.lang')

[zzwrap.lang]
description = "Language of a resource"
type = language
always = 1
on_error = redirect-nocache

[zzwrap.no-cookie]
description = "Check if a cookie is allowed"
type = bool
always = 1
on_error = redirect-nocache
